name: CD

# Everything this repository publishes, in one workflow (GPU-489): the GPU
# image on a push to deploy, and the global part of the cache every node
# reads, on the hour. Each job runs only for the events it is there for, by
# an `if:` on the event: the image only on a push, the cache's jobs on the
# schedule and by hand, and the runtime's fill also right after an image.
#
# The GPU image, built and pushed to the registry on every push to the deploy
# branch: `git push origin main:deploy` publishes the main it was given. Only
# that branch, because the image is gigabytes and each push is a new tag that
# a backend may start nodes with; main only runs the checks in CI.yml.
#
# Two tags: smith's commit, which says exactly what is in the image (the
# libraries are pinned in Dockerfile.gpu, so the commit decides it all), and
# `latest`, for a person who wants the newest by hand.
#
# Neither is what a backend starts nodes from: its digest is (GPU-412). This
# is a public repository whose collaborators can push branches, and a
# workflow on any branch can ask the repository's token for packages: write,
# so a tag in the registry is anyone's with write access here. The image's
# last step tells the backend the digest it pushed, with SMITH_IMAGE_TOKEN, a
# secret of the `production` environment, which only main and deploy enter
# and only the owner can update: a branch can rewrite `latest`, never which
# bytes a node runs. A token of its own, not the cache builder's (GPU-452):
# the hourly jobs that fill the cache cannot choose the image nodes start
# from, and only the image's job names it.
#
# The cache, in two jobs:
#
# - `runtime` (runtime.py fill): the GPU image carries torch and its CUDA
#   libraries only as a lock, runtime.json, and a node fetches each wheel from
#   the cache before the index. So the wheels a published image's lock names
#   and the cache lacks are fetched from their index and uploaded: right after
#   the `gpu` job publishes it, and again every hour, which is the runtime's
#   check that heals itself - a wheel that failed, or a cache emptied since, is
#   filled by the next hour. A wheel's name fixes its content, so most runs
#   find everything present and are done in about a minute.
# - `wheels` (builder.py): once an hour it asks the backend whether a node
#   reported a wheel to build, and builds one, in the GPU image the nodes run,
#   from PyPI's source. It takes hours, so none of that waits on a push.
#
# The two are the same kind of work: the same two secrets, and the same
# signed writes into the global cache, the backend signing each upload for
# one path at one size. No bucket key here, on purpose: this is a public
# repository. Nor does the cache have to be trusted for what it holds: every
# node checks every runtime wheel against the lock's sha256, and fill checks
# it before uploading too.
#
# The image they read is the one nodes start from, by the digest the backend
# holds, and never a tag (GPU-452): `latest` is anyone's to rewrite, as above.
# And nothing that runs in the image is given the token: the build runs an
# sdist's own setup.py, so the runner takes the build, the container compiles
# it, and the runner pushes the wheel it left, after checking it is the one
# asked for (builder.py). Each step that needs the token names it; the others
# have none.
#
# On this repository's runners because they are public ones: 4 CPUs and 16 GB,
# two nvcc of flash-attn at once, where a private repository's 7 GB holds one.
#
# Secrets: SMITH_BACKEND, the backend's address, SMITH_IMAGE_TOKEN, the
# image's token, and SMITH_BUILDER_TOKEN, the builder token. Without them (a
# fork) each cache job says so and does nothing, and the image's last step
# fails. They live in the `production` environment, which only main and
# deploy can enter, both of which only the owner can update, rather than
# among the repository's secrets, which a workflow on any branch can read:
# anyone who could push a branch could otherwise print them (GPU-412).

on:
  push:
    branches: [deploy]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Nothing more by default: each job asks for what it needs, so the cache's
# jobs, which run every hour, never hold the token that can write the
# registry.
permissions:
  contents: read

# A timeout on every job (GPU-493), so that nothing holds a runner for
# GitHub's default of six hours; each says why its number.

# No concurrency for the whole workflow: the hourly runs and the pushes to
# deploy would queue behind each other, and GitHub keeps only one waiting run
# per group, so an hour could replace a push's image. Each job that must not
# overlap has its own group below.

jobs:
  # The whole CI of this commit first: no image is built and pushed, and no
  # digest reaches the backend, unless it passes (GPU-487). CI before CD.
  # Only on a push: the schedule and a run by hand publish no image.
  # Releases reach customers only from Friday 00:00 to Sunday 23:59,
  # Italian time (GPU-494): changes go out together, when there is time
  # to follow the deploy and roll it back, and the Actions minutes go to
  # those runs. First, so a push outside the window stops here before
  # spending a minute on CI. An urgent fix goes out any day from a commit
  # whose message has a line `Hotfix: <why>`; the reason stays in git and
  # in this run's log.
  window:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Friday to Sunday, Italian time, or a hotfix
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          day="$(TZ=Europe/Rome date +%u)"
          if [ "$day" -ge 5 ]; then
            echo "$(TZ=Europe/Rome date '+%A %H:%M'): inside the release window"
            exit 0
          fi
          reason="$(printf '%s\n' "$MESSAGE" | grep -E '^Hotfix: .{10,}' | head -n 1 || true)"
          if [ -n "$reason" ]; then
            echo "::warning::released outside the window as a hotfix. $reason"
            exit 0
          fi
          echo "::error::releases go out from Friday 00:00 to Sunday 23:59, Italian time (GPU-494)." \
            "For an urgent fix, push a commit whose message has a line 'Hotfix: <why>'."
          exit 1

  ci:
    if: github.event_name == 'push'
    needs: window
    uses: ./.github/workflows/CI.yml

  gpu:
    # Skipped whenever `ci` is, so only on a push to deploy.
    needs: ci
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two pushes to deploy each get their image; neither is cancelled halfway,
    # which would leave a tag that does not exist after a push that said it
    # would. On the job, no longer on the workflow, for the reason above: the
    # CI of two pushes may now run side by side, their images still one at a
    # time.
    concurrency:
      group: gpu-image
      cancel-in-progress: false
    # Three to six minutes on every image of November 2026; thirty leaves
    # room for a build with nothing cached, and for a slow registry.
    timeout-minutes: 30
    steps:
      # Every action is pinned to a commit, its tag beside it: a tag can be
      # moved by whoever controls the action, and this job may publish the
      # image every node starts from (packages: write). Moving to a newer
      # release is a change of the pin, made on purpose.
      #
      # Full history: the check below has to prove the commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The provenance check ravex's and moonclip's CD make before they tag
      # (GPU-493): deploy publishes what main has, not a commit pushed there
      # from a branch nobody merged. First, so such a push builds nothing,
      # publishes nothing and tells the backend nothing.
      - name: The commit must be on main
        run: |
          set -eu
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "deploy is at $(git rev-parse --short HEAD), which is not on main." >&2
            echo "Push main to it: git push origin main:deploy. No image was built." >&2
            exit 1
          fi
      # torch with its CUDA libraries does not fit beside what the runner
      # ships with; these are the largest of the tools it does not need.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Tag
        id: tag
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu"
          echo "image=$repo:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          # Which image this is, from inside it: smith writes it at the top
          # of each job's output.
          build-args: |
            SMITH_IMAGE=${{ steps.tag.outputs.image }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
      # A tag that is not in the registry only shows up later, as a node that
      # never boots: check it here, where the failure is still readable.
      - name: The tag is in the registry
        run: |
          docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null
          docker manifest inspect "${{ steps.tag.outputs.latest }}" > /dev/null
      # No layer over 250 MB, as pulled: a host's docker starts a dropped
      # layer again from its first byte, so a big one is what a slow host
      # never finishes (GPU-225). Checked on what was pushed, not on what
      # the Dockerfile says.
      - name: Every layer is under 250 MB
        run: |
          image="${{ steps.tag.outputs.image }}"
          digest=$(docker buildx imagetools inspect --raw "$image" | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          for item in index.get("manifests", []):
              if item.get("platform", {}).get("architecture") == "amd64":
                  print(item["digest"]); break
          else:
              print("")')
          ref="$image"; [ -n "$digest" ] && ref="${image%%:*}@$digest"
          docker buildx imagetools inspect --raw "$ref" | python3 -c '
          import json, sys
          layers = json.load(sys.stdin)["layers"]
          limit = 250 * 1000 * 1000
          for layer in layers:
              print("%7.1f MB  %s" % (layer["size"] / 1e6, layer["digest"][:19]))
          total = sum(layer["size"] for layer in layers)
          print("%7.1f MB  in all" % (total / 1e6))
          big = [layer for layer in layers if layer["size"] > limit]
          sys.exit("%d layer(s) over 250 MB" % len(big) if big else 0)'
      # Last, after every check: a backend starts nodes from this digest as
      # soon as it is told, so an image that failed one is never told.
      - name: Tell the backend the digest
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_IMAGE_TOKEN: ${{ secrets.SMITH_IMAGE_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$SMITH_BACKEND" ] || [ -z "$SMITH_IMAGE_TOKEN" ]; then
            echo "No SMITH_BACKEND or SMITH_IMAGE_TOKEN: no backend will start nodes from this image." >&2
            exit 1
          fi
          body=$(printf '{"digest": "%s", "commit": "%s"}' "$DIGEST" "$GITHUB_SHA")
          curl -sSf -X POST "${SMITH_BACKEND%/}/api/agent-image" \
            -H "Authorization: Bearer $SMITH_IMAGE_TOKEN" -H "Content-Type: application/json" \
            -d "$body" > /dev/null
      - name: Summary
        run: echo "Pushed \`${{ steps.tag.outputs.image }}\` (\`${{ steps.build.outputs.digest }}\`), now also \`latest\`; nodes start from the digest" >> "$GITHUB_STEP_SUMMARY"

  runtime:
    # Right after the image it fills for, and only when it was pushed: a
    # failed build published no lock. Its last step told the backend the
    # digest, so the image the backend names by then is the one just
    # published. On the schedule and by hand there is no image job, and it
    # runs on its own: !cancelled() rather than the default success(), which a
    # skipped `gpu` would fail.
    needs: gpu
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.gpu.result == 'success') }}
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To read the CI run of the commit, below.
      actions: read
    # Every pipe fails its step, as `fill | tee` must when fill does.
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    # Its own group, apart from the build's: a build of hours never holds up
    # a fill, and two fills never list the cache before either has written,
    # which would upload the same wheels twice.
    concurrency:
      group: cache-runtime
      cancel-in-progress: false
    steps:
      # On the hour and by hand this runs main's head, which no `ci` job
      # vouched for: only a push to deploy goes through it (GPU-493). So the
      # commit's own CI run has to have passed, or nothing below runs this
      # commit's code with the cache's token. Not a failure when it has not:
      # a CI still running on a commit pushed a minute ago is the usual case,
      # and the next hour finds it finished.
      - name: CI passed on this commit
        id: ci
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/CI.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "never run" else (.conclusion // .status) end')
          if [ "$conclusion" = "success" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "CI passed on ${GITHUB_SHA::7}"
          else
            echo "::warning title=Nothing filled or built::CI on ${GITHUB_SHA::7} is $conclusion, not success: this run stops here, and the next one asks again."
            echo "CI on \`${GITHUB_SHA::7}\` is $conclusion, not success: nothing was filled or built." >> "$GITHUB_STEP_SUMMARY"
          fi
      # On the hour, main's commit: its runtime.py reads every lock of version
      # 1, an older image's too, which may predate fill. After a push, the
      # commit just published, whose runtime.py wrote this very lock.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The digest nodes start from, which the backend holds. Without the
      # secrets (a fork), or a backend that names none, there is no image.
      # Every step after this one waits on its output, so skipping it on a
      # commit whose CI did not pass skips them all.
      - name: Image
        id: image
        if: github.event_name == 'push' || steps.ci.outputs.ok == '1'
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
        run: |
          python3 builder.py --pending >> "$GITHUB_OUTPUT"
          grep -q '^image=sha256:' "$GITHUB_OUTPUT" || echo "No image digest from the backend: no runtime to fill." >> "$GITHUB_STEP_SUMMARY"
      # The image is public; logged in anyway, so a private one works the same.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.image.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the lock out of the image: about 300 MB pulled, never started.
      - name: Lock
        if: steps.image.outputs.image != ''
        env:
          DIGEST: ${{ steps.image.outputs.image }}
        run: |
          id=$(docker create "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu@$DIGEST")
          docker cp "$id:/app/runtime.json" runtime.json
          docker rm "$id" > /dev/null
          python3 -c 'import json; print(len(json.load(open("runtime.json"))["files"]), "wheels in the lock")'
      # One wheel on disk at a time (runtime.py), so the runner's free disk
      # holds the largest, about a gigabyte, and needs no room made. The token
      # reaches runtime.py through its environment, never its arguments.
      - name: Fill
        if: steps.image.outputs.image != ''
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
        run: |
          python3 runtime.py fill --manifest runtime.json \
            --builder "${SMITH_BACKEND%/}/api/cache-runtime/sign" 2>&1 | tee fill.log
      - name: Summary
        if: always() && steps.image.outputs.image != ''
        env:
          DIGEST: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "Runtime cache for \`smith-gpu@$DIGEST\`:"
            echo
            echo '```'
            # Everything but the wheels already there, which are most of them.
            grep -v '^\[runtime\] present ' fill.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wheels:
    environment: production
    # Not after an image is published: that is the runtime's trigger, and the
    # build queue is asked on the hour anyway.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To read the CI run of the commit, below.
      actions: read
    defaults:
      run:
        shell: bash
    # Under GitHub's six hours, so a build that runs long is stopped here and
    # the backend, which hears nothing, queues it again once.
    timeout-minutes: 340
    # One build at a time: a run that finds the last one still going waits for
    # it rather than taking a second build beside it on another runner.
    concurrency:
      group: wheels
      cancel-in-progress: false
    steps:
      # On the hour and by hand this runs main's head, which no `ci` job
      # vouched for: only a push to deploy goes through it (GPU-493). So the
      # commit's own CI run has to have passed, or nothing below runs this
      # commit's code with the cache's token. Not a failure when it has not:
      # a CI still running on a commit pushed a minute ago is the usual case,
      # and the next hour finds it finished.
      - name: CI passed on this commit
        id: ci
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/CI.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "never run" else (.conclusion // .status) end')
          if [ "$conclusion" = "success" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "CI passed on ${GITHUB_SHA::7}"
          else
            echo "::warning title=Nothing filled or built::CI on ${GITHUB_SHA::7} is $conclusion, not success: this run stops here, and the next one asks again."
            echo "CI on \`${GITHUB_SHA::7}\` is $conclusion, not success: nothing was filled or built." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Asked before anything heavy: most hours there is nothing to build, and
      # the image is gigabytes. The answer names the image too, by digest.
      # Every step after this one waits on its output, so skipping it on a
      # commit whose CI did not pass skips them all.
      - name: Anything to build
        id: pending
        if: steps.ci.outputs.ok == '1'
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
        run: python3 builder.py --pending >> "$GITHUB_OUTPUT"
      - name: Make room
        if: steps.pending.outputs.pending == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.pending.outputs.pending == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pulled before the build is taken: a build claimed and then not built
      # waits for the backend to queue it again.
      - name: Pull
        if: steps.pending.outputs.pending == '1'
        env:
          DIGEST: ${{ steps.pending.outputs.image }}
        run: docker pull -q "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu@$DIGEST"
      - name: Claim
        id: claim
        if: steps.pending.outputs.pending == '1'
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
        run: python3 builder.py --claim "$RUNNER_TEMP/build.json" >> "$GITHUB_OUTPUT"
      # The builder from this checkout, in the image: what builds is this
      # commit's builder.py, against the Python and torch the nodes have. No
      # token and no backend in there: it reads the build and leaves a wheel.
      - name: Build
        if: steps.claim.outputs.claimed == '1'
        env:
          DIGEST: ${{ steps.pending.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # torch first: the image carries only its lock (runtime.py), and a
          # wheel is built against the torch the nodes install from it.
          docker run --rm \
            -v "$PWD/builder.py:/builder/builder.py:ro" -v "$PWD/cache.py:/builder/cache.py:ro" \
            -v "$RUNNER_TEMP/build.json:/builder/build.json:ro" -v "$RUNNER_TEMP/out:/out" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu@$DIGEST" \
            sh -c "python /app/smith/runtime.py install --manifest /app/runtime.json && python /builder/builder.py --build /builder/build.json --out /out"
      # Whatever the build did, a claimed build is told to the backend: its
      # wheel pushed, or why there is none.
      - name: Finish
        if: always() && steps.claim.outputs.claimed == '1'
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
        run: python3 builder.py --finish "$RUNNER_TEMP/build.json" --out "$RUNNER_TEMP/out"
