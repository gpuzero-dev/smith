name: CI

# Every check of this repository, on any commit anyone pushes or proposes.
# CD.yml calls it too, on the commit it is about to publish: no image is
# built and pushed, and no digest reaches the backend, unless it passes
# (GPU-487, GPU-489).

on:
  # Not deploy: there CD.yml runs this same CI before it builds the image,
  # and a second run on the same commit would only spend minutes.
  push:
    branches-ignore: [deploy]
  pull_request:
  workflow_dispatch:
  # CD.yml runs it on the commit it builds, before the image is pushed.
  workflow_call:

# Checks only: the token reads the repository and does nothing else.
permissions:
  contents: read
  # actions: write is for the last step of every job (fail fast): a job that
  # fails cancels the whole run, and with it the CD that called it, so no
  # other job keeps spending minutes on a commit already known to be bad.
  actions: write

# An ordinary run supersedes the one before it on the same ref: only the
# newest commit's verdict matters. A call from CD.yml is different: inside a
# called workflow the github context is the caller's, so its ref is deploy
# and its workflow is "CD", and in the group of an ordinary run on deploy it
# could cancel that run or be cancelled by it, and a cancelled call is an
# image never published. So a call gets a group of its own, unique to the CD
# run (run_id is the caller's too), which nothing else ever joins (GPU-489).
concurrency:
  group: ${{ github.workflow == 'CI' && format('ci-{0}', github.ref) || format('ci-cd-{0}', github.run_id) }}
  cancel-in-progress: true

# A timeout on every job (GPU-493): GitHub's default is six hours, and CD.yml
# waits on this file before it publishes. Both jobs finished in about a minute
# on every run of November 2026; ten and fifteen leave room for a slow index
# or registry without letting a hang hold the runner.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # smith is standard library only: it has to compile and start on the
      # oldest Python it claims, with nothing installed.
      - run: python -m py_compile smith.py builder.py cache.py
      - run: python smith.py --help
      - name: Every config parses
        run: |
          python - <<'EOF'
          import glob, tomllib
          for path in sorted(glob.glob("smith*.toml")):
              with open(path, "rb") as handle:
                  config = tomllib.load(handle)
              assert config.get("scripts"), path
              print("ok", path)
          EOF
      # pytest for the tests only, after the checks above have run on a bare
      # interpreter. Without Moonclip the bucket's tests skip: those run where
      # there is an S3 server (tests/test_cache_s3.py says how).
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests -q
      - name: Stop the whole run
        if: failure()
        env:
          MATRIX: ${{ matrix && toJSON(matrix) || '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The cancel marks this job cancelled too: the error says which one failed.
            core.error(`${context.job} ${process.env.MATRIX} failed: the rest of the run is cancelled`);
            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });

  image:
    # The CPU image from PyPI: proves the repository builds on its own, without
    # any checkout of the libraries. The GPU image is the same recipe with gigabytes more
    # torch: it is built and pushed by CD.yml, on a push to the deploy branch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smith:ci
      # No libraries in the image (GPU-523): what makes a job's environment is.
      - name: The image can make a job's environment
        run: |
          docker run --rm smith:ci sh -c "uv --version && test -f /app/smith/environment.py"
      - name: Stop the whole run
        if: failure()
        env:
          MATRIX: ${{ matrix && toJSON(matrix) || '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The cancel marks this job cancelled too: the error says which one failed.
            core.error(`${context.job} ${process.env.MATRIX} failed: the rest of the run is cancelled`);
            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });
