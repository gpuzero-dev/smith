name: CI

# Every check of this repository, on any commit anyone pushes or proposes.
# CD.yml calls it too, on the commit it is about to publish: no image is
# built and pushed, and no digest reaches the backend, unless it passes
# (GPU-487, GPU-489).

on:
  # Not deploy: there CD.yml runs this same CI before it builds the image,
  # and a second run on the same commit would only spend minutes.
  push:
    branches-ignore: [deploy]
  pull_request:
  workflow_dispatch:
  # CD.yml runs it on the commit it builds, before the image is pushed.
  workflow_call:

# Checks only: the token reads the repository and does nothing else.
permissions:
  contents: read
  # actions: write is for the last step of every job (fail fast): a job that
  # fails cancels the whole run, and with it the CD that called it, so no
  # other job keeps spending minutes on a commit already known to be bad.
  actions: write

# An ordinary run supersedes the one before it on the same ref: only the
# newest commit's verdict matters. A call from CD.yml is different: inside a
# called workflow the github context is the caller's, so its ref is deploy
# and its workflow is "CD", and in the group of an ordinary run on deploy it
# could cancel that run or be cancelled by it, and a cancelled call is an
# image never published. So a call gets a group of its own, unique to the CD
# run (run_id is the caller's too), which nothing else ever joins (GPU-489).
concurrency:
  group: ${{ github.workflow == 'CI' && format('ci-{0}', github.ref) || format('ci-cd-{0}', github.run_id) }}
  cancel-in-progress: true

# A timeout on every job (GPU-493): GitHub's default is six hours, and CD.yml
# waits on this file before it publishes. Both jobs finished in about a minute
# on every run of November 2026; ten and fifteen leave room for a slow index
# or registry without letting a hang hold the runner.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # smith is standard library only: it has to compile and start on the
      # oldest Python it claims, with nothing installed.
      - run: python -m py_compile smith.py builder.py cache.py
      - run: python smith.py --help
      - name: Every config parses
        run: |
          python - <<'EOF'
          import glob, tomllib
          for path in sorted(glob.glob("smith*.toml")):
              with open(path, "rb") as handle:
                  config = tomllib.load(handle)
              assert config.get("scripts"), path
              print("ok", path)
          EOF
      # The images install the libraries' latest releases (GPU-366): until
      # 2026-11-08 they installed ravex 0.10.1 while 0.11.x was out, and the
      # nodes ignored a stop that the docs said saves first.
      #
      # A pin behind PyPI is a warning, not a failure (GPU-493). It used to
      # fail, which turned this CI red at every Ravex or Moonclip release, on
      # commits that had not changed, until both Dockerfiles were moved - and
      # CD.yml runs this file, so a release elsewhere also blocked every
      # deploy of smith, an urgent fix included, behind an unrelated bump. The
      # warning still shows on every run, the deploy's included, which is
      # where the bump gets remembered. The same goes for PyPI not answering:
      # its outage is not this commit's fault either. The two Dockerfiles
      # disagreeing stays a failure: that is a mistake made here, and nothing
      # outside causes it.
      - name: The images pin the latest releases
        run: |
          python - <<'EOF'
          import json, re, urllib.request
          pins = {}
          for path in ("Dockerfile", "Dockerfile.gpu"):
              text = open(path, encoding="utf-8").read()
              for name in ("RAVEX", "MOONCLIP"):
                  found = re.findall(r"^ARG %s_VERSION=(\S+)$" % name, text, re.M)
                  assert len(found) == 1, (path, name, found)
                  pins.setdefault(name.lower(), set()).add(found[0])
          for package, versions in sorted(pins.items()):
              assert len(versions) == 1, "the two Dockerfiles pin %s differently: %s" % (package, sorted(versions))
              pinned = versions.pop()
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/%s/json" % package, timeout=30) as answer:
                      latest = json.load(answer)["info"]["version"]
              except OSError as error:
                  print("::warning title=PyPI did not answer::could not check %s %s against PyPI: %s" % (package, pinned, error))
                  continue
              if pinned != latest:
                  print("::warning title=%s behind PyPI::the images pin %s %s, PyPI's latest is %s: move %s_VERSION in Dockerfile and Dockerfile.gpu" % (package, package, pinned, latest, package.upper()))
              else:
                  print("ok", package, pinned)
          EOF
      # pytest for the tests only, after the checks above have run on a bare
      # interpreter. Without Moonclip the bucket's tests skip: those run where
      # there is an S3 server (tests/test_cache_s3.py says how).
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests -q
      - name: Stop the whole run
        if: failure()
        env:
          MATRIX: ${{ matrix && toJSON(matrix) || '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The cancel marks this job cancelled too: the error says which one failed.
            core.error(`${context.job} ${process.env.MATRIX} failed: the rest of the run is cancelled`);
            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });

  image:
    # The CPU image from PyPI: proves the repository builds on its own, without
    # any checkout of the libraries. The GPU image is the same recipe with gigabytes more
    # torch: it is built and pushed by CD.yml, on a push to the deploy branch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smith:ci
      - name: The libraries import, and the examples are where the config says
        run: |
          docker run --rm smith:ci python -c "import moonclip, ravex; print(ravex.__version__)"
          docker run --rm smith:ci test -f /app/examples/spiral.py
      - name: Stop the whole run
        if: failure()
        env:
          MATRIX: ${{ matrix && toJSON(matrix) || '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The cancel marks this job cancelled too: the error says which one failed.
            core.error(`${context.job} ${process.env.MATRIX} failed: the rest of the run is cancelled`);
            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });
