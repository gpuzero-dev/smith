name: Wheels

# The builder of the cache every node reads (builder.py): once an hour it asks
# the backend whether a node reported a wheel to build, and builds one, in the
# GPU image the nodes run, from PyPI's source. A workflow of its own, apart
# from the image's: it runs on a schedule, holds a token that may write the
# shared cache, and takes hours, none of which a push should wait for.
#
# On this repository's runners because they are public ones: 4 CPUs and 16 GB,
# two nvcc of flash-attn at once, where a private repository's 7 GB holds one.
#
# Secrets: SMITH_BACKEND, the backend's address, and SMITH_BUILDER_TOKEN, its
# builder token. Without them it says so and builds nothing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One build at a time: a run that finds the last one still going waits for it
# rather than taking a second build beside it on another runner.
concurrency:
  group: wheels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Under GitHub's six hours, so a build that runs long is stopped here and
    # the backend, which hears nothing, queues it again once.
    timeout-minutes: 340
    env:
      SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
      SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/smith-gpu:latest
    steps:
      - uses: actions/checkout@v4
      # Asked before anything heavy: most hours there is nothing to build, and
      # the image is gigabytes.
      - name: Anything to build
        id: pending
        run: python3 builder.py --pending >> "$GITHUB_OUTPUT"
      - name: Make room
        if: steps.pending.outputs.pending == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/login-action@v3
        if: steps.pending.outputs.pending == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder from this checkout, in the image: what builds is this
      # commit's builder.py, against the Python and torch the nodes have.
      - name: Build
        if: steps.pending.outputs.pending == '1'
        run: |
          IMAGE="${IMAGE,,}"
          docker pull -q "$IMAGE"
          # torch first: the image carries only its lock (runtime.py), and a
          # wheel is built against the torch the nodes install from it.
          docker run --rm -e SMITH_BACKEND -e SMITH_BUILDER_TOKEN \
            -v "$PWD/builder.py:/builder/builder.py:ro" -v "$PWD/cache.py:/builder/cache.py:ro" \
            "$IMAGE" sh -c "python /app/smith/runtime.py install --manifest /app/runtime.json && python /builder/builder.py"
