name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only: the token reads the repository and does nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # smith is standard library only: it has to compile and start on the
      # oldest Python it claims, with nothing installed.
      - run: python -m py_compile smith.py builder.py cache.py
      - run: python smith.py --help
      - name: Every config parses
        run: |
          python - <<'EOF'
          import glob, tomllib
          for path in sorted(glob.glob("smith*.toml")):
              with open(path, "rb") as handle:
                  config = tomllib.load(handle)
              assert config.get("scripts"), path
              print("ok", path)
          EOF
      # The images install pinned releases, and a fix released in Ravex or
      # Moonclip reaches no node until the pin moves: 0.11.0's SIGTERM fix sat
      # unused behind 0.10.1 for a week (GPU-366). Red until both Dockerfiles
      # name the newest release of each.
      - name: The images pin the newest Ravex and Moonclip
        run: |
          python - <<'EOF'
          import json, re, urllib.request
          for library in ("ravex", "moonclip"):
              with urllib.request.urlopen("https://pypi.org/pypi/%s/json" % library, timeout=30) as answer:
                  newest = json.load(answer)["info"]["version"]
              for path in ("Dockerfile", "Dockerfile.gpu"):
                  pinned = re.search(r"^ARG %s_VERSION=(\S+)$" % library.upper(), open(path).read(), re.M).group(1)
                  assert pinned == newest, "%s pins %s %s; the newest on PyPI is %s" % (path, library, pinned, newest)
                  print("ok", path, library, pinned)
          EOF
      # pytest for the tests only, after the checks above have run on a bare
      # interpreter. Without Moonclip the bucket's tests skip: those run where
      # there is an S3 server (tests/test_cache_s3.py says how).
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests -q

  image:
    # The CPU image from PyPI: proves the repository builds on its own, without
    # any checkout of the libraries. The GPU image is the same recipe with gigabytes more
    # torch: it is built and pushed by image.yml, on a push to the deploy branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smith:ci
      - name: The libraries import, and the examples are where the config says
        run: |
          docker run --rm smith:ci python -c "import moonclip, ravex; print(ravex.__version__)"
          docker run --rm smith:ci test -f /app/examples/spiral.py
