name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only: the token reads the repository and does nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # smith is standard library only: it has to compile and start on the
      # oldest Python it claims, with nothing installed.
      - run: python -m py_compile smith.py builder.py cache.py
      - run: python smith.py --help
      - name: Every config parses
        run: |
          python - <<'EOF'
          import glob, tomllib
          for path in sorted(glob.glob("smith*.toml")):
              with open(path, "rb") as handle:
                  config = tomllib.load(handle)
              assert config.get("scripts"), path
              print("ok", path)
          EOF
      # The images install the libraries' latest releases (GPU-366): until
      # 2026-11-08 they installed ravex 0.10.1 while 0.11.x was out, and the
      # nodes ignored a stop that the docs said saves first. A release of
      # either turns this red until both Dockerfiles are moved to it.
      - name: The images pin the latest releases
        run: |
          python - <<'EOF'
          import json, re, urllib.request
          pins = {}
          for path in ("Dockerfile", "Dockerfile.gpu"):
              text = open(path, encoding="utf-8").read()
              for name in ("RAVEX", "MOONCLIP"):
                  found = re.findall(r"^ARG %s_VERSION=(\S+)$" % name, text, re.M)
                  assert len(found) == 1, (path, name, found)
                  pins.setdefault(name.lower(), set()).add(found[0])
          for package, versions in sorted(pins.items()):
              assert len(versions) == 1, "the two Dockerfiles pin %s differently: %s" % (package, sorted(versions))
              with urllib.request.urlopen("https://pypi.org/pypi/%s/json" % package, timeout=30) as answer:
                  latest = json.load(answer)["info"]["version"]
              pinned = versions.pop()
              assert pinned == latest, "%s: the images pin %s, PyPI's latest is %s" % (package, pinned, latest)
              print("ok", package, pinned)
          EOF
      # pytest for the tests only, after the checks above have run on a bare
      # interpreter. Without Moonclip the bucket's tests skip: those run where
      # there is an S3 server (tests/test_cache_s3.py says how).
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests -q

  image:
    # The CPU image from PyPI: proves the repository builds on its own, without
    # any checkout of the libraries. The GPU image is the same recipe with gigabytes more
    # torch: it is built and pushed by image.yml, on a push to the deploy branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: smith:ci
      - name: The libraries import, and the examples are where the config says
        run: |
          docker run --rm smith:ci python -c "import moonclip, ravex; print(ravex.__version__)"
          docker run --rm smith:ci test -f /app/examples/spiral.py
