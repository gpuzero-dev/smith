name: GPU image

# The GPU image, built and pushed to the registry on every push to the deploy
# branch: `git push origin main:deploy` publishes the main it was given. Only
# that branch, because the image is gigabytes and each push is a new tag that
# a backend may start nodes with; main only runs the checks in ci.yml.
#
# Two tags: smith's commit, which says exactly what is in the image (the
# libraries are pinned in Dockerfile.gpu, so the commit decides it all), and
# `latest`, which a backend can name once and never change again: the deploy
# branch is the deliberate step, so the newest image it published is the one
# to start nodes with.

on:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

# Two pushes to deploy each get their image; neither is cancelled halfway,
# which would leave a tag that does not exist after a push that said it would.
concurrency:
  group: gpu-image
  cancel-in-progress: false

jobs:
  gpu:
    runs-on: ubuntu-latest
    steps:
      # torch with its CUDA libraries does not fit beside what the runner
      # ships with; these are the largest of the tools it does not need.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu"
          echo "image=$repo:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          # Which image this is, from inside it: smith writes it at the top
          # of each job's output.
          build-args: |
            SMITH_IMAGE=${{ steps.tag.outputs.image }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
      # A tag that is not in the registry only shows up later, as a node that
      # never boots: check it here, where the failure is still readable.
      - name: The tag is in the registry
        run: |
          docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null
          docker manifest inspect "${{ steps.tag.outputs.latest }}" > /dev/null
      # No layer over 250 MB, as pulled: a host's docker starts a dropped
      # layer again from its first byte, so a big one is what a slow host
      # never finishes (GPU-225). Checked on what was pushed, not on what
      # the Dockerfile says.
      - name: Every layer is under 250 MB
        run: |
          image="${{ steps.tag.outputs.image }}"
          digest=$(docker buildx imagetools inspect --raw "$image" | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          for item in index.get("manifests", []):
              if item.get("platform", {}).get("architecture") == "amd64":
                  print(item["digest"]); break
          else:
              print("")')
          ref="$image"; [ -n "$digest" ] && ref="${image%%:*}@$digest"
          docker buildx imagetools inspect --raw "$ref" | python3 -c '
          import json, sys
          layers = json.load(sys.stdin)["layers"]
          limit = 250 * 1000 * 1000
          for layer in layers:
              print("%7.1f MB  %s" % (layer["size"] / 1e6, layer["digest"][:19]))
          total = sum(layer["size"] for layer in layers)
          print("%7.1f MB  in all" % (total / 1e6))
          big = [layer for layer in layers if layer["size"] > limit]
          sys.exit("%d layer(s) over 250 MB" % len(big) if big else 0)'
      - name: Summary
        run: echo "Pushed \`${{ steps.tag.outputs.image }}\`, now also \`latest\`" >> "$GITHUB_STEP_SUMMARY"
