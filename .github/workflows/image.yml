name: GPU image

# The GPU image, built and pushed to the registry on every push to the deploy
# branch: `git push origin main:deploy` publishes the main it was given. Only
# that branch, because the image is gigabytes and each push is a new tag that
# a backend may start nodes with; main only runs the checks in ci.yml.
#
# Two tags: smith's commit, which says exactly what is in the image (the
# libraries are pinned in Dockerfile.gpu, so the commit decides it all), and
# `latest`, for a person who wants the newest by hand.
#
# Neither is what a backend starts nodes from: its digest is (GPU-412). This
# is a public repository whose collaborators can push branches, and a
# workflow on any branch can ask the repository's token for packages: write,
# so a tag in the registry is anyone's with write access here. The last step
# tells the backend the digest it pushed, with SMITH_IMAGE_TOKEN, a secret
# of the `production` environment, which only main and deploy enter and only
# the owner can update: a branch can rewrite `latest`, never which bytes a
# node runs. A token of its own, not the cache builder's (GPU-452): the
# hourly jobs that fill the cache cannot choose the image nodes start from.

on:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

# Two pushes to deploy each get their image; neither is cancelled halfway,
# which would leave a tag that does not exist after a push that said it would.
concurrency:
  group: gpu-image
  cancel-in-progress: false

jobs:
  # The whole CI of this commit first: no image is built and pushed, and no
  # digest reaches the backend, unless it passes (GPU-487). CI before CD.
  ci:
    uses: ./.github/workflows/ci.yml

  gpu:
    needs: ci
    environment: production
    runs-on: ubuntu-latest
    steps:
      # torch with its CUDA libraries does not fit beside what the runner
      # ships with; these are the largest of the tools it does not need.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      # Every action is pinned to a commit, its tag beside it: a tag can be
      # moved by whoever controls the action, and this job may publish the
      # image every node starts from (packages: write). Moving to a newer
      # release is a change of the pin, made on purpose.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag
        id: tag
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu"
          echo "image=$repo:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          # Which image this is, from inside it: smith writes it at the top
          # of each job's output.
          build-args: |
            SMITH_IMAGE=${{ steps.tag.outputs.image }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
      # A tag that is not in the registry only shows up later, as a node that
      # never boots: check it here, where the failure is still readable.
      - name: The tag is in the registry
        run: |
          docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null
          docker manifest inspect "${{ steps.tag.outputs.latest }}" > /dev/null
      # No layer over 250 MB, as pulled: a host's docker starts a dropped
      # layer again from its first byte, so a big one is what a slow host
      # never finishes (GPU-225). Checked on what was pushed, not on what
      # the Dockerfile says.
      - name: Every layer is under 250 MB
        run: |
          image="${{ steps.tag.outputs.image }}"
          digest=$(docker buildx imagetools inspect --raw "$image" | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          for item in index.get("manifests", []):
              if item.get("platform", {}).get("architecture") == "amd64":
                  print(item["digest"]); break
          else:
              print("")')
          ref="$image"; [ -n "$digest" ] && ref="${image%%:*}@$digest"
          docker buildx imagetools inspect --raw "$ref" | python3 -c '
          import json, sys
          layers = json.load(sys.stdin)["layers"]
          limit = 250 * 1000 * 1000
          for layer in layers:
              print("%7.1f MB  %s" % (layer["size"] / 1e6, layer["digest"][:19]))
          total = sum(layer["size"] for layer in layers)
          print("%7.1f MB  in all" % (total / 1e6))
          big = [layer for layer in layers if layer["size"] > limit]
          sys.exit("%d layer(s) over 250 MB" % len(big) if big else 0)'
      # Last, after every check: a backend starts nodes from this digest as
      # soon as it is told, so an image that failed one is never told.
      - name: Tell the backend the digest
        env:
          SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
          SMITH_IMAGE_TOKEN: ${{ secrets.SMITH_IMAGE_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$SMITH_BACKEND" ] || [ -z "$SMITH_IMAGE_TOKEN" ]; then
            echo "No SMITH_BACKEND or SMITH_IMAGE_TOKEN: no backend will start nodes from this image." >&2
            exit 1
          fi
          body=$(printf '{"digest": "%s", "commit": "%s"}' "$DIGEST" "$GITHUB_SHA")
          curl -sSf -X POST "${SMITH_BACKEND%/}/api/agent-image" \
            -H "Authorization: Bearer $SMITH_IMAGE_TOKEN" -H "Content-Type: application/json" \
            -d "$body" > /dev/null
      - name: Summary
        run: echo "Pushed \`${{ steps.tag.outputs.image }}\` (\`${{ steps.build.outputs.digest }}\`), now also \`latest\`; nodes start from the digest" >> "$GITHUB_STEP_SUMMARY"
