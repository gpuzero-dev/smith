name: Cache

# The global part of the cache every node reads, filled from here, in two jobs:
#
# - `runtime` (runtime.py fill): the GPU image carries torch and its CUDA
#   libraries only as a lock, runtime.json, and a node fetches each wheel from
#   the cache before the index. So the wheels a published image's lock names
#   and the cache lacks are fetched from their index and uploaded: right after
#   image.yml publishes it, and again every hour, which is the runtime's check
#   that heals itself - a wheel that failed, or a cache emptied since, is
#   filled by the next hour. A wheel's name fixes its content, so most runs
#   find everything present and are done in about a minute.
# - `wheels` (builder.py): once an hour it asks the backend whether a node
#   reported a wheel to build, and builds one, in the GPU image the nodes run,
#   from PyPI's source. It takes hours, so none of that waits on a push.
#
# One workflow because they are the same kind of work: the same two secrets,
# and the same signed writes into the global cache, the backend signing each
# upload for one path at one size. No bucket key here, on purpose: this is a
# public repository. Nor does the cache have to be trusted for what it holds:
# every node checks every runtime wheel against the lock's sha256, and fill
# checks it before uploading too.
#
# On this repository's runners because they are public ones: 4 CPUs and 16 GB,
# two nvcc of flash-attn at once, where a private repository's 7 GB holds one.
#
# Secrets: SMITH_BACKEND, the backend's address, and SMITH_BUILDER_TOKEN, its
# builder token. Without them (a fork) each job says so and does nothing.

on:
  schedule:
    - cron: "17 * * * *"
  # After image.yml, for the runtime only, and only when it pushed: a failed
  # build published no lock.
  workflow_run:
    workflows: ["GPU image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag whose runtime to fill: smith's short commit, or latest"
        required: false
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Its own group, apart from the build's: a build of hours never holds up
    # a fill, and two fills never list the cache before either has written,
    # which would upload the same wheels twice.
    concurrency:
      group: cache-runtime
      cancel-in-progress: false
    env:
      SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
      SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
    steps:
      - name: Secrets
        id: secrets
        run: |
          if [ -z "$SMITH_BACKEND" ] || [ -z "$SMITH_BUILDER_TOKEN" ]; then
            echo "No SMITH_BACKEND or SMITH_BUILDER_TOKEN: no runtime to fill." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      # The workflow's own commit, which is main's: its runtime.py reads every
      # lock of version 1, an older image's too, which may predate fill.
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == '1'
      # After image.yml, the image it just published: tagged with the short
      # commit it was built from, the head of the run that built it. By hand,
      # the tag asked for; on the hour, latest, which nodes start from.
      - name: Image
        id: image
        if: steps.secrets.outputs.ok == '1'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-latest}"
          [ -n "$HEAD_SHA" ] && tag="${HEAD_SHA::7}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smith-gpu:$tag" >> "$GITHUB_OUTPUT"
      # The image is public; logged in anyway, so a private one works the same.
      - uses: docker/login-action@v3
        if: steps.secrets.outputs.ok == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the lock out of the image: about 300 MB pulled, never started.
      - name: Lock
        if: steps.secrets.outputs.ok == '1'
        run: |
          id=$(docker create "${{ steps.image.outputs.image }}")
          docker cp "$id:/app/runtime.json" runtime.json
          docker rm "$id" > /dev/null
          python3 -c 'import json; print(len(json.load(open("runtime.json"))["files"]), "wheels in the lock")'
      # One wheel on disk at a time (runtime.py), so the runner's free disk
      # holds the largest, about a gigabyte, and needs no room made. The token
      # reaches runtime.py through its environment, never its arguments.
      - name: Fill
        if: steps.secrets.outputs.ok == '1'
        run: |
          set -o pipefail
          python3 runtime.py fill --manifest runtime.json \
            --builder "${SMITH_BACKEND%/}/api/cache-runtime/sign" 2>&1 | tee fill.log
      - name: Summary
        if: always() && steps.secrets.outputs.ok == '1'
        run: |
          {
            echo "Runtime cache for \`${{ steps.image.outputs.image }}\`:"
            echo
            echo '```'
            # Everything but the wheels already there, which are most of them.
            grep -v '^\[runtime\] present ' fill.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wheels:
    # Not after an image is published: that is the runtime's trigger, and the
    # build queue is asked on the hour anyway.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    # Under GitHub's six hours, so a build that runs long is stopped here and
    # the backend, which hears nothing, queues it again once.
    timeout-minutes: 340
    # One build at a time: a run that finds the last one still going waits for
    # it rather than taking a second build beside it on another runner.
    concurrency:
      group: wheels
      cancel-in-progress: false
    env:
      SMITH_BACKEND: ${{ secrets.SMITH_BACKEND }}
      SMITH_BUILDER_TOKEN: ${{ secrets.SMITH_BUILDER_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/smith-gpu:latest
    steps:
      - uses: actions/checkout@v4
      # Asked before anything heavy: most hours there is nothing to build, and
      # the image is gigabytes.
      - name: Anything to build
        id: pending
        run: python3 builder.py --pending >> "$GITHUB_OUTPUT"
      - name: Make room
        if: steps.pending.outputs.pending == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/login-action@v3
        if: steps.pending.outputs.pending == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder from this checkout, in the image: what builds is this
      # commit's builder.py, against the Python and torch the nodes have.
      - name: Build
        if: steps.pending.outputs.pending == '1'
        run: |
          IMAGE="${IMAGE,,}"
          docker pull -q "$IMAGE"
          # torch first: the image carries only its lock (runtime.py), and a
          # wheel is built against the torch the nodes install from it.
          docker run --rm -e SMITH_BACKEND -e SMITH_BUILDER_TOKEN \
            -v "$PWD/builder.py:/builder/builder.py:ro" -v "$PWD/cache.py:/builder/cache.py:ro" \
            "$IMAGE" sh -c "python /app/smith/runtime.py install --manifest /app/runtime.json && python /builder/builder.py"
