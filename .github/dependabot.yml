# Dependabot (GPU-493). One pull request per ecosystem a week, every update
# grouped into it: a pull request per dependency would bury the few that
# matter, and the repository's CI runs on each one in full.
#
# github-actions moves the actions the workflows pin by commit, comment and
# all, which is the half of pinning that otherwise never happens. The
# container images the workflows pin by digest are not in reach of any
# ecosystem here, and are moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The base images of the Dockerfiles. Not to a new minor or major version:
  # that is a new Python interpreter, which is a decision with the classifiers
  # and the CI matrix, not a dependency bump.
  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # No pip entry: smith is standard library only, with no requirements
  # file or pyproject.toml for Dependabot to read. The libraries the images
  # install are the ARG pins in the Dockerfiles, which CI.yml compares with
  # PyPI on every run.
