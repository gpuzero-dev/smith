# smith in Dockerfile.gpu, on a provider's GPU node.
#
# One file for every node: what differs between them - the backend's address,
# the node's name and card, the bucket - comes from the environment (see
# smith.py), and so do the secrets, which never go in a file:
# SMITH_TOKEN, MOONCLIP_S3_ACCESS_KEY, MOONCLIP_S3_SECRET_KEY.

backend = "http://127.0.0.1:8600"
# What a job asks for to land here. Set SMITH_HARDWARE to the card -
# gpu-a100, gpu-h100 - so a job for one does not go to the other.
hardware = "gpu"
# Staging for the stores, which live in the bucket; and _logs/.
runs = "/runs"
# torch and its CUDA libraries, which the image does not carry: fetched and
# installed by runtime.py before the first job: from the backend's cache when
# the node uses it (SMITH_CACHE=backend), else from a mirror if
# SMITH_RUNTIME_URL is set, else from the index they were resolved from.
runtime = "/app/runtime.json"

# The bucket every run's store goes to, under <prefix>/<run id>. A pod is gone
# once it stops, and the bucket is what lets a run resume or fork on another.
# The bucket and endpoint come from SMITH_STORAGE_BUCKET and
# SMITH_STORAGE_ENDPOINT; without them the agent keeps the stores on the
# pod's disk, which is only fine for trying the image out.
# [storage]
# type = "r2"
# prefix = "runs"

[scripts]
# `model` and `params`: see smith.docker.toml.
spiral = { path = "/app/examples/spiral.py", model = ["width"], params = { lr = 5e-3, steps = 3000 } }
# What log_metrics costs a step on this card: ravex's bench, printed to the
# job's output. Not a training run - it makes one small store per arm.
metrics_cost = { path = "/app/bench/metrics_cost.py", params = { steps = 600 } }
# What quantizing an outer delta costs on this card - torch on CPU, torch on
# CUDA, and ravex's TileLang kernel - after checking the kernel writes the
# torch path's bytes (GPU-139). Prints CHECK OK or CHECK FAILED first.
quant_cost = { path = "/app/bench/quant_cost.py", params = { elements = 67108864, repeat = 3 } }
